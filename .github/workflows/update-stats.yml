
name: Update Fantasy Stats

on:
  schedule:
    # Runs every Tuesday at 10:00 AM UTC (5:00 AM EST / 2:00 AM PST) after Monday Night Football
    - cron: '0 10 * * 2'
  workflow_dispatch: # Allows you to click a button to run it manually anytime!

permissions:
  contents: write # Gives the Action permission to save the JSON files to your repo

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos = "https://r-project.org")'

      - name: Run R stats script
        run: Rscript .github/scripts/update_stats.R

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add stats/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly fantasy stats" && git push)
